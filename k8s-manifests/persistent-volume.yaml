apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-pv
  labels:
    type: local
    app: sample-app
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/app"
    type: DirectoryOrCreate

---
# NFS 持久卷示例
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-pv-nfs
  labels:
    type: nfs
    app: sample-app
spec:
  storageClassName: nfs
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: nfs-server.example.com
    path: "/exported/path"

---
# Local 持久卷示例
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-pv-local
  labels:
    type: local-ssd
    app: sample-app
spec:
  storageClassName: local-storage
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  local:
    path: /mnt/disks/ssd1
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - node-1
          - node-2

---
# iSCSI 持久卷示例
apiVersion: v1
kind: PersistentVolume
metadata:
  name: app-pv-iscsi
  labels:
    type: iscsi
    app: sample-app
spec:
  storageClassName: iscsi
  capacity:
    storage: 15Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  iscsi:
    targetPortal: 192.168.1.100:3260
    iqn: iqn.2021-01.com.example:storage.target01
    lun: 0
    fsType: ext4
    readOnly: false
